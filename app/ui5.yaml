specVersion: "4.0"
metadata:
  name: sap.btp.enterprise.extension
type: application

framework:
  name: SAPUI5
  version: "1.120.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core

server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      mountPath: /odata
      afterMiddleware: compression
      configuration:
        baseUri: "http://localhost:4004/odata/v4/catalog"
